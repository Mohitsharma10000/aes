<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restock — Aeva Essentials</title>
    <meta name="description" content="Same formula. Less packaging." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/tokens.css?v=chrome-9" />
    <script src="assets/theme.js?v=spec-1"></script>
    <link rel="stylesheet" href="styles/base.css?v=sticky-1" />
    <link rel="stylesheet" href="styles/radius.css?v=squircle-2" />
    <link rel="stylesheet" href="styles/components.css?v=chrome-1" />
    <link rel="stylesheet" href="styles/pages.css?v=spec-1" />
    <link rel="stylesheet" href="styles/production.css?v=width-1" />
    <link rel="stylesheet" href="styles/spec.css?v=chrome-14" />
    <link rel="stylesheet" href="styles/branch.css?v=ia-3" />
    <link rel="stylesheet" href="styles/paper-chrome.css?v=paper-22" />
  </head>
  <body data-aeva-chrome="restock">
    <div id="site-header-mount"></div>
    <main id="main">
      <header class="shop-hero shop-hero--sage">
        <div class="shop-hero__media">
          <img src="assets/catalog/hero-restock.jpg?v=1" alt="A bottle waiting beside 1 litre restock pouches" />
          <div class="shop-hero__copy">
            <h1>Restock</h1>
            <p class="shop-mast__lede">Same formula. Less packaging.</p>
          </div>
        </div>
      </header>

      <div class="shop-page">
        <div class="product-grid product-grid--shop" data-collection="restock-all"></div>
        <section class="also-like" id="restock-accessories" data-also-carousel aria-labelledby="restock-also-title">
          <h2 id="restock-also-title">You May Also Like</h2>
          <div class="also-like__viewport">
            <div class="also-like__track" data-collection="kits-accessories"></div>
          </div>
        </section>

        <section class="shop-chapter shop-faq" aria-labelledby="restock-faq-title">
          <h2 id="restock-faq-title">Questions</h2>
          <div id="shop-faq-list"></div>
        </section>
        <p class="shop-top"><a href="#main">Back to top</a></p>
      </div>
    </main>
    <div id="site-footer-mount"></div>
    <div id="cart-mount"></div>
    <script src="data/catalog.js?v=atelier-1"></script>
    <script src="assets/cart.js?v=ia-1"></script>
    <script src="assets/cards.js?v=atelier-1"></script>
    <script src="assets/partials.js?v=ia-13"></script>
    <script src="assets/search.js?v=spec-3"></script>
    <script src="assets/app.js?v=atelier-1"></script>
    <script src="assets/filters.js?v=ia-2"></script>
    <script src="assets/also-like.js?v=ia-1"></script>
  </body>
</html>
